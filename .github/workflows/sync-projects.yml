name: Sync projects from GitHub topics

on:
  schedule:
    # Every day at 04:17 UTC. Off the hour on purpose — scheduled jobs at :00
    # queue behind everyone else's.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull repos tagged with the portfolio topic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-projects.mjs

      - name: Commit if the project list changed
        run: |
          if git diff --quiet -- data/projects.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "chore: sync project list from GitHub topics"
          git push
